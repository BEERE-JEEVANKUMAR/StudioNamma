<!DOCTYPE html>
<html>
<head>
<title>Library Management</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#6a11cb,#2575fc);
    margin:0;
    padding:0;
}

.container{
    width:60%;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#333;
}

h2{
    color:#444;
}

a.button{
    display:inline-block;
    padding:10px 15px;
    margin:10px 0;
    background:#2575fc;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

a.button:hover{
    background:#1a5edb;
}

ul{
    list-style:none;
    padding:0;
}

li{
    padding:10px;
    margin:8px 0;
    background:#f3f3f3;
    border-radius:5px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.borrow{
    background:#ff6b6b;
    color:white;
    padding:5px 10px;
    border-radius:4px;
    text-decoration:none;
}

.borrow:hover{
    background:#e04d4d;
}

input{
    padding:10px;
    width:70%;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    padding:10px 15px;
    background:#28a745;
    border:none;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#218838;
}

</style>

</head>

<body>

<div class="container">

<h1>📚 Library Management System</h1>

<a class="button" href="/add">Add New Book</a>

<h2>Available Books</h2>

<ul>
{% for book in books %}
<li>
{{ book }}
<a class="borrow" href="/borrow/{{book}}">Borrow</a>
</li>
{% endfor %}
</ul>

<h2>Return Book</h2>

<form action="/return" method="POST">
<input type="text" name="book" placeholder="Enter book name">
<button type="submit">Return</button>
</form>

</div>

</body>
</html>
