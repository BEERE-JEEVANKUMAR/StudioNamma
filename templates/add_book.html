<!DOCTYPE html>
<html>
<head>
<title>Add Book</title>

<style>

body{
    font-family: Arial;
    background: linear-gradient(135deg,#ff9966,#ff5e62);
    margin:0;
}

.container{
    width:40%;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
}

h2{
    color:#333;
}

input{
    width:80%;
    padding:10px;
    margin:15px 0;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    padding:10px 20px;
    background:#2575fc;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1a5edb;
}

a{
    display:block;
    margin-top:15px;
    text-decoration:none;
    color:#555;
}

</style>

</head>

<body>

<div class="container">

<h2>Add Book</h2>

<form method="POST">
<input type="text" name="book" placeholder="Enter book name">
<br>
<button type="submit">Add Book</button>
</form>

<a href="/">⬅ Back to Home</a>

</div>

</body>
</html>
